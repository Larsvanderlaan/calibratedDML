[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibratedDML"
version = "0.1.0"
description = "Calibrated debiased machine learning for categorical treatments"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
keywords = ["causal-inference", "double-machine-learning", "dml", "treatment-effects", "python"]
authors = [
  {name = "Lars van der Laan", email = "lvdlaan@uw.edu"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3"
]

[project.urls]
Homepage = "https://github.com/Larsvanderlaan/DRinference"
Repository = "https://github.com/Larsvanderlaan/DRinference"
Issues = "https://github.com/Larsvanderlaan/DRinference/issues"
Documentation = "https://github.com/Larsvanderlaan/DRinference/tree/main/docs"

[project.optional-dependencies]
gam = ["pygam>=0.9"]
boosted = ["lightgbm>=4.0"]
dev = [
  "build>=1.2",
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
