name: r-package

on:
  push:
    paths:
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "docs/**"
      - "tests/testthat/**"
      - "tests/fixtures/**"
      - "tests/testthat.R"
      - "src/**"
      - "pyproject.toml"
      - "validation/check_linear_functional_parity.py"
      - "validation/linear_functional_parity.R"
      - ".github/workflows/r-package.yml"
  pull_request:
    paths:
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "docs/**"
      - "tests/testthat/**"
      - "tests/fixtures/**"
      - "tests/testthat.R"
      - "src/**"
      - "pyproject.toml"
      - "validation/check_linear_functional_parity.py"
      - "validation/linear_functional_parity.R"
      - ".github/workflows/r-package.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            local::.
            any::testthat
            any::knitr
            any::rmarkdown
      - name: Verify package and test dependencies
        shell: Rscript {0}
        run: |
          for (package in c("calibratedDML", "testthat", "knitr", "rmarkdown")) {
            if (!requireNamespace(package, quietly = TRUE)) {
              stop("Missing CI dependency: ", package)
            }
          }
      - name: Run R tests
        shell: Rscript {0}
        run: |
          testthat::test_dir("tests/testthat", reporter = "summary",
            package = "calibratedDML", load_package = "installed")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check R/Python linear-functional agreement
        run: |
          python -m pip install -e .
          python validation/check_linear_functional_parity.py
      - name: Render vignettes
        shell: Rscript {0}
        run: |
          output_dir <- tempdir()
          rmarkdown::render("vignettes/standard-workflows.Rmd", output_dir = output_dir, quiet = TRUE)
          rmarkdown::render("vignettes/custom-learners.Rmd", output_dir = output_dir, quiet = TRUE)
          rmarkdown::render("vignettes/supplied-nuisances.Rmd", output_dir = output_dir, quiet = TRUE)
          rmarkdown::render("vignettes/adaptive-binary-treatment.Rmd", output_dir = output_dir, quiet = TRUE)
