name: python-package

on:
  push:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "examples/**"
      - "docs/**"
      - "src/**"
      - "tests/python/**"
      - ".github/workflows/python-package.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.md"
      - "examples/**"
      - "docs/**"
      - "src/**"
      - "tests/python/**"
      - ".github/workflows/python-package.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q tests/python/test_python_api.py
      - name: Run quickstart example
        run: python examples/python_quickstart.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel in a clean environment
        run: |
          python -m venv /tmp/calibrateddml-wheel
          /tmp/calibrateddml-wheel/bin/pip install dist/*.whl
          /tmp/calibrateddml-wheel/bin/python -c "from calibrateddml import CalibratedDML; print(CalibratedDML.__name__)"
      - name: Install built sdist in a clean environment
        run: |
          python -m venv /tmp/calibrateddml-sdist
          /tmp/calibrateddml-sdist/bin/pip install dist/*.tar.gz
          /tmp/calibrateddml-sdist/bin/python -c "from calibrateddml import CalibratedDML; print(CalibratedDML.__name__)"

  optional-gam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gam extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gam]"
      - name: Run optional gam tests
        run: pytest -q tests/python/test_python_optional_backends.py -k gam

  optional-boosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install boosted extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,boosted]"
      - name: Run optional boosted-tree tests
        run: pytest -q tests/python/test_python_optional_backends.py -k boosted
